<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CCNA Tracker</title>
<desc>Banner image for the CCNA Tracker repository, showing a stylized network topology in blue, teal, and amber on a dark navy background.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0b1220"/>
    <stop offset="100%" stop-color="#111a30"/>
  </linearGradient>
  <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#34d399"/>
  </linearGradient>
</defs>

<rect x="0" y="0" width="1200" height="300" fill="url(#bg)"/>

<!-- network mesh lines -->
<g stroke="url(#lineGrad)" stroke-width="1.2" opacity="0.55">
  <line x1="60" y1="60" x2="230" y2="120"/>
  <line x1="230" y1="120" x2="150" y2="230"/>
  <line x1="230" y1="120" x2="380" y2="70"/>
  <line x1="380" y1="70" x2="520" y2="150"/>
  <line x1="150" y1="230" x2="380" y2="70"/>
  <line x1="1140" y1="55" x2="990" y2="115"/>
  <line x1="990" y1="115" x2="1060" y2="230"/>
  <line x1="990" y1="115" x2="850" y2="80"/>
  <line x1="850" y1="80" x2="720" y2="160"/>
  <line x1="1060" y1="230" x2="850" y2="80"/>
</g>

<!-- nodes, left cluster -->
<g>
  <circle cx="60" cy="60" r="6" fill="#38bdf8"/>
  <circle cx="230" cy="120" r="8" fill="#34d399"/>
  <circle cx="150" cy="230" r="6" fill="#38bdf8"/>
  <circle cx="380" cy="70" r="6" fill="#fbbf24"/>
  <circle cx="520" cy="150" r="5" fill="#38bdf8"/>
</g>

<!-- nodes, right cluster -->
<g>
  <circle cx="1140" cy="55" r="6" fill="#38bdf8"/>
  <circle cx="990" cy="115" r="8" fill="#34d399"/>
  <circle cx="1060" cy="230" r="6" fill="#fbbf24"/>
  <circle cx="850" cy="80" r="6" fill="#38bdf8"/>
  <circle cx="720" cy="160" r="5" fill="#38bdf8"/>
</g>

<!-- title block -->
<text x="600" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#f8fafc" letter-spacing="2">CCNA TRACKER</text>
<text x="600" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="3">STUDY &amp; TEST PREP — EXAM 200-301</text>

<!-- domain color legend -->
<g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#cbd5e1">
  <circle cx="330" cy="230" r="5" fill="#38bdf8"/>
  <text x="342" y="234">Network Fundamentals</text>

  <circle cx="330" cy="252" r="5" fill="#34d399"/>
  <text x="342" y="256">Network Access</text>

  <circle cx="500" cy="230" r="5" fill="#fbbf24"/>
  <text x="512" y="234">IP Connectivity</text>

  <circle cx="500" cy="252" r="5" fill="#f472b6"/>
  <text x="512" y="256">IP Services</text>

  <circle cx="650" cy="230" r="5" fill="#a78bfa"/>
  <text x="662" y="234">Security Fundamentals</text>

  <circle cx="650" cy="252" r="5" fill="#fb923c"/>
  <text x="662" y="256">Automation &amp; Programmability</text>
</g>
</svg>
