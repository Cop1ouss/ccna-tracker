# Runs on every push and pull request. A red X here blocks the merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Links, JSON and JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check every local link, JSON file and script
        run: python3 .github/scripts/check_site.py

  python:
    name: Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile every script
        run: python -m compileall -q scripts
      - name: Smoke test
        run: |
          python scripts/coverage.py
          python scripts/subnet_drill.py --help
          python scripts/sync_anki.py --help
